schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, request_id, job_id, probe_kind, executable_ref,
  argv_template, environment_fingerprint, timeout_seconds, resource_limits,
  output_subdir, expected_artifacts, source_fingerprints, approval_ref,
  request_fingerprint]
properties:
  schema_version: {type: string, const: "1.0"}
  request_id: {type: string, pattern: '^EDAPROBE\.[A-Z0-9_.-]+$'}
  job_id: {type: string, pattern: '^JOB\.[A-Z0-9_.-]+$'}
  probe_kind:
    enum: [VERILATOR_VERSION, CPP_BUILD_VERSION, CPP_COMPILER_VERSION,
      BINARY_BUILD, BINARY_RUN, TIMING_BUILD, TIMING_RUN, VCD_BUILD,
      VCD_RUN, COVERAGE_BUILD, COVERAGE_RUN, FST_BUILD, FST_RUN,
      G002_WARNING_CAPTURE, G002_STRICT_BUILD,
      G003_SMOKE_BUILD, G003_SMOKE_RUN,
      G004_ARTIFACT_BUILD, G004_ARTIFACT_RUN,
      G004_COMPILE_FAILURE, G004_RUNTIME_STOP,
      G004_RUNTIME_FATAL, G004_RUNTIME_TIMEOUT,
      G005_LINKED_RERUN, PROJECT_BUILD, PROJECT_RUN]
  executable_ref: {type: string, pattern: '^EDAEXEC\.[A-Z0-9_.-]+$'}
  argv_template:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: {enum: [LITERAL, SOURCE, OUTPUT_DIR]}
        value: {type: string, minLength: 1}
  environment_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  timeout_seconds: {type: integer, minimum: 1, maximum: 600}
  resource_limits:
    type: object
    additionalProperties: false
    required: [cpu_seconds, memory_mb, output_files]
    properties:
      cpu_seconds: {type: integer, minimum: 1, maximum: 600}
      memory_mb: {type: integer, minimum: 64, maximum: 4096}
      output_files: {type: integer, minimum: 1}
  output_subdir:
    {type: string, pattern: '^runs/[A-Za-z0-9][A-Za-z0-9._/-]*$'}
  expected_artifacts:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [kind, relative_path, required, minimum_bytes]
      properties:
        kind: {enum: [EXECUTABLE, TRACE_VCD, TRACE_FST, COVERAGE,
          MODEL_MAKEFILE, MODEL_ARCHIVE]}
        relative_path:
          {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'}
        required: {type: boolean}
        minimum_bytes: {type: integer, minimum: 1}
  source_fingerprints:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [path, fingerprint]
      properties:
        path:
          {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  approval_ref: {type: string, pattern: '^EDAAPPROVAL\.[A-Z0-9_.-]+$'}
  request_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}

schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, artifact_kind, execution_id, job_id,
  binding_fingerprint, environment_identity, all_testcases_passed,
  testcase_total, passed, failed, not_run, testcases, coverage]
properties:
  schema_version: {type: string, const: "1.0"}
  artifact_kind: {type: string, const: EDA_TEST_SUITE_FINAL_RESULT}
  execution_id: {type: string, pattern: '^EDA001\.[A-Z0-9_.-]+$'}
  job_id: {type: string, pattern: '^JOB\.[A-Z0-9_.-]+$'}
  binding_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  environment_identity: {type: string, pattern: '^XCELIUMENV\.[A-Z0-9_.-]+$'}
  all_testcases_passed: {type: boolean}
  testcase_total: {type: integer, minimum: 1}
  passed: {type: integer, minimum: 0}
  failed: {type: integer, minimum: 0}
  not_run: {type: integer, minimum: 0}
  testcases:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, seed, execution_status, exit_code, pass_marker_observed,
        duration_seconds]
      properties:
        id: {type: string}
        seed: {type: integer}
        execution_status: {enum: [PASS, FAIL, BLOCKED_TOOL, NOT_RUN]}
        exit_code: {type: [integer, 'null']}
        pass_marker_observed: {type: [boolean, 'null']}
        duration_seconds: {type: number, minimum: 0}
  coverage:
    type: object
    additionalProperties: false
    required: [status, included_testcases, categories, native_report_paths]
    properties:
      status: {enum: [DISABLED, AVAILABLE, UNAVAILABLE]}
      included_testcases: {type: array, items: {type: string}}
      categories: {type: object}
      native_report_paths: {type: array, items: {type: string}}

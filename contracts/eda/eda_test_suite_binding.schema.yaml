schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, artifact_kind, binding_id, job_id, sources, dut,
  testbench, parameters, include_dirs, defines, testcases, binding_fingerprint]
properties:
  schema_version: {type: string, const: "1.0"}
  artifact_kind: {type: string, const: EDA_TEST_SUITE_BINDING}
  binding_id: {type: string, pattern: '^BINDING\.EDA\.[A-Z0-9_.-]+$'}
  job_id: {type: string, pattern: '^JOB\.[A-Z0-9_.-]+$'}
  sources:
    type: array
    minItems: 2
    items:
      type: object
      additionalProperties: false
      required: [path, role]
      properties:
        path: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'}
        role: {enum: [RTL, TESTBENCH]}
  dut: {$ref: '#/$defs/top'}
  testbench: {$ref: '#/$defs/top'}
  parameters: {type: object}
  include_dirs: {type: array, items: {type: string}}
  defines: {type: array, items: {type: string}}
  testcases:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, source_paths, selected_test, seed, timeout_seconds,
        pass_marker, uvm]
      properties:
        id: {type: string, pattern: '^[A-Z][A-Z0-9_.-]{0,127}$'}
        source_paths: {type: array, minItems: 1, items: {type: string}}
        selected_test: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_$]*$'}
        seed: {type: integer, minimum: 1, maximum: 2147483647}
        timeout_seconds: {type: integer, minimum: 1, maximum: 3600}
        pass_marker: {type: string, pattern: '^DV_[A-Z0-9_]+_PASS$'}
        uvm: {type: boolean}
  binding_fingerprint: {$ref: '#/$defs/fingerprint'}
$defs:
  fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  top:
    type: object
    additionalProperties: false
    required: [top]
    properties:
      top: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_$]*$'}

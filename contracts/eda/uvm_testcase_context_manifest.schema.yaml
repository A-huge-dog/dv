schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, artifact_kind, context_files]
properties:
  schema_version: {type: string, const: "1.0"}
  artifact_kind: {type: string, const: UVM_TESTCASE_CONTEXT_MANIFEST}
  context_files:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [logical_path, path, kind]
      properties:
        logical_path: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'}
        path: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'}
        kind: {enum: [CAPABILITY_CONTRACT, PUBLIC_DECLARATION]}

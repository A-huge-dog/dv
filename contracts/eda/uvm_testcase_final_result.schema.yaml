schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, artifact_kind, execution_id, job_id, binding_fingerprint,
  environment_identity, environment_fingerprint, status, testcases]
properties:
  schema_version: {type: string, const: "1.0"}
  artifact_kind: {type: string, const: UVM_TESTCASE_FINAL_RESULT}
  execution_id: {type: string, pattern: '^EDA002\.[A-Z0-9_.-]+$'}
  job_id: {type: string, pattern: '^JOB\.PROJECT\.[A-Z0-9_.-]+$'}
  binding_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  environment_identity: {type: string, pattern: '^XCELIUMENV\.[A-Z0-9_.-]+$'}
  environment_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  status: {enum: [PASS, FAIL, BLOCKED]}
  testcases:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [testcase_id, uvm_class, seed, status, exit_code, pass_marker_observed,
        uvm_error_count, uvm_fatal_count, logs]
      properties:
        testcase_id: {type: string, pattern: '^TC\.[A-Z0-9_.-]+$'}
        uvm_class: {type: string, pattern: '^uvm_tc_[a-z0-9_]+_[0-9a-f]{12}$'}
        seed: {type: integer}
        status: {enum: [PASS, FAIL, BLOCKED, NOT_RUN]}
        exit_code: {type: [integer, 'null']}
        pass_marker_observed: {type: [boolean, 'null']}
        uvm_error_count: {type: [integer, 'null'], minimum: 0}
        uvm_fatal_count: {type: [integer, 'null'], minimum: 0}
        logs:
          type: array
          items: {type: string, pattern: '^runs/xcelium/[A-Za-z0-9][A-Za-z0-9._/-]*$'}

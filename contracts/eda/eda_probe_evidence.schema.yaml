schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, evidence_id, request_id, request_fingerprint,
  job_id, probe_kind, executable_ref, environment_fingerprint, started_at,
  ended_at, exit_code, execution_status, timed_out, logs, artifacts,
  diagnostic_codes, evidence_class, qualification_scope,
  evidence_fingerprint]
properties:
  schema_version: {type: string, const: "1.0"}
  evidence_id: {type: string, pattern: '^EVIDENCE\.EDA\.[A-Z0-9_.-]+$'}
  request_id: {type: string, pattern: '^EDAPROBE\.[A-Z0-9_.-]+$'}
  request_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  job_id: {type: string, pattern: '^JOB\.[A-Z0-9_.-]+$'}
  probe_kind:
    enum: [VERILATOR_VERSION, CPP_BUILD_VERSION, CPP_COMPILER_VERSION,
      BINARY_BUILD, BINARY_RUN, TIMING_BUILD, TIMING_RUN, VCD_BUILD,
      VCD_RUN, COVERAGE_BUILD, COVERAGE_RUN, FST_BUILD, FST_RUN,
      G002_WARNING_CAPTURE, G002_STRICT_BUILD,
      G003_SMOKE_BUILD, G003_SMOKE_RUN,
      G004_ARTIFACT_BUILD, G004_ARTIFACT_RUN,
      G004_COMPILE_FAILURE, G004_RUNTIME_STOP,
      G004_RUNTIME_FATAL, G004_RUNTIME_TIMEOUT,
      G005_LINKED_RERUN, PROJECT_BUILD, PROJECT_RUN]
  executable_ref: {type: string, pattern: '^EDAEXEC\.[A-Z0-9_.-]+$'}
  environment_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  started_at:
    {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T.*Z$'}
  ended_at:
    {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T.*Z$'}
  exit_code: {type: integer, minimum: -255, maximum: 255}
  execution_status: {enum: [PASS, FAIL, BLOCKED_TOOL]}
  timed_out: {type: boolean}
  logs:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [kind, relative_path, fingerprint, size_bytes]
      properties:
        kind: {enum: [STDOUT, STDERR]}
        relative_path:
          {type: string, pattern: '^runs/[A-Za-z0-9][A-Za-z0-9._/-]*$'}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        size_bytes: {type: integer, minimum: 0}
  artifacts:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [artifact_id, kind, relative_path, fingerprint, size_bytes]
      properties:
        artifact_id: {type: string, pattern: '^ART\.EDA\.[A-Z0-9_.-]+$'}
        kind: {enum: [EXECUTABLE, TRACE_VCD, TRACE_FST, COVERAGE,
          MODEL_MAKEFILE, MODEL_ARCHIVE]}
        relative_path:
          {type: string, pattern: '^runs/[A-Za-z0-9][A-Za-z0-9._/-]*$'}
        fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
        size_bytes: {type: integer, minimum: 1}
  diagnostic_codes:
    type: array
    items:
      enum: [PROCESS_EXIT_NONZERO, PROCESS_TIMEOUT, MISSING_ARTIFACT,
        OUTPUT_FILE_LIMIT, OPTIONAL_DEPENDENCY_MISSING,
        RUNTIME_DEPENDENCY_MISSING]
  evidence_class: {type: string, const: REAL_EDA_QUALIFICATION}
  qualification_scope:
    {enum: [VERILATOR_G001_CAPABILITY, F003_MODEL_BUILD_QUALIFICATION,
      SYNTHETIC_TICKET_GATE_SMOKE,
      SYNTHETIC_TICKET_GATE_ARTIFACT_DEBUG,
      SYNTHETIC_TICKET_GATE_LINKED_RERUN,
      PROJECT_VERILATOR_EXECUTION]}
  evidence_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}

schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, artifact_kind, execution_id, job_id, binding_path,
  binding_fingerprint, coverage]
properties:
  schema_version: {type: string, const: "1.0"}
  artifact_kind: {type: string, const: EDA_TEST_SUITE_REQUEST}
  execution_id: {type: string, pattern: '^EDA001\.[A-Z0-9_.-]+$'}
  job_id: {type: string, pattern: '^JOB\.[A-Z0-9_.-]+$'}
  binding_path: {type: string, pattern: '^audit/eda001/bindings/[a-z0-9_.-]+\.json$'}
  binding_fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  coverage: {type: boolean}

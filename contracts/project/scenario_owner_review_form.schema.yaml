schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, form_kind, form_id, job_id,
  scenario_ac_map_path, scenario_ac_map_fingerprint, actor, scenarios,
  context_fingerprint]
properties:
  schema_version: {type: string, const: "1.0"}
  form_kind: {type: string, const: SCENARIO_OWNER_REVIEW}
  form_id: {type: string, pattern: '^OWNERREVIEWFORM\.PROJECT\.[A-Z0-9_.-]+$'}
  job_id: {type: string, pattern: '^JOB\.PROJECT\.[A-Z0-9_.-]+$'}
  scenario_ac_map_path: {type: string, pattern: '^staging/mappings/scenario_ac_map\.r000\.json$'}
  scenario_ac_map_fingerprint: {$ref: '#/$defs/fingerprint'}
  actor:
    type: object
    additionalProperties: false
    required: [actor_type, identity, role]
    properties:
      actor_type: {type: string, const: HUMAN}
      identity: {type: string, maxLength: 256}
      role: {type: string, const: DV_OWNER}
  scenarios:
    type: array
    minItems: 1
    maxItems: 512
    items:
      type: object
      additionalProperties: false
      required: [scenario_id, ac_ids, status, reason, spec_evidence,
        scenario_fingerprint, comment, routing]
      properties:
        scenario_id: {type: string, pattern: '^SCENARIO\.[A-Z0-9_.-]+$'}
        ac_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^AC\.[A-Z0-9_.-]+$'}
        status: {enum: [CHECKABLE, OBSERVATION_ONLY, BLOCKED_CONTRACT, SPEC_AMBIGUITY]}
        reason: {type: string, maxLength: 4096}
        spec_evidence:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/$defs/evidence'}
        scenario_fingerprint: {$ref: '#/$defs/fingerprint'}
        comment: {type: string, maxLength: 4096}
        routing:
          type: object
          additionalProperties: false
          required: [destination]
          properties:
            destination:
              type: [string, 'null']
              enum: [AC_TESTCASE_MAP_AND_TESTCASE, SCENARIO_AC_MAPPER,
                SPEC_AGENT, null]
  context_fingerprint: {$ref: '#/$defs/fingerprint'}
$defs:
  fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  evidence:
    type: object
    additionalProperties: false
    required: [path, line_start, line_end, snippet, snippet_fingerprint]
    properties:
      path: {type: string, minLength: 1}
      line_start: {type: integer, minimum: 1}
      line_end: {type: integer, minimum: 1}
      snippet: {type: string, minLength: 1, maxLength: 4096}
      snippet_fingerprint: {$ref: '#/$defs/fingerprint'}

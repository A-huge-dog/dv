schema_version: '1.0'
type: object
additionalProperties: false
required:
- schema_version
- artifact_kind
- job_id
- input_fingerprint
- snapshot_fingerprint
- sources
- include_dirs
- top
- execution
- binding_fingerprint
properties:
  schema_version:
    const: '1.0'
  artifact_kind:
    const: PROJECT_EXECUTION_BUNDLE
  job_id:
    type: string
    pattern: ^JOB\.PROJECT\.[A-Z0-9_.-]+$
  input_fingerprint: &id001
    type: string
    pattern: ^[0-9a-f]{64}$
  snapshot_fingerprint: *id001
  sources:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - path
      - byte_fingerprint
      properties:
        path: &id002
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._/-]*$
        byte_fingerprint: *id001
  include_dirs:
    type: array
    items: *id002
  top:
    type: string
    pattern: ^[A-Za-z_][A-Za-z0-9_$]*$
  execution:
    type: object
    additionalProperties: false
    required:
    - profile_id
    - executable_ref
    - profile_fingerprint
    - environment_identity
    - environment_fingerprint
    - constraints
    - resource_limits
    properties:
      profile_id:
        const: EDAPROFILE.XCELIUM.PROJECT.V1
      executable_ref:
        const: EDAEXEC.XCELIUM
      profile_fingerprint: *id001
      environment_identity:
        type: string
        minLength: 1
      environment_fingerprint: *id001
      constraints:
        type: object
        additionalProperties: false
        required:
        - timeout_seconds
        - seed
        - uvm
        - coverage
        - waves
        properties:
          timeout_seconds:
            type: integer
            minimum: 1
            maximum: 3600
          seed:
            type: integer
            minimum: 1
            maximum: 2147483647
          uvm:
            const: true
          coverage: &id003
            type: boolean
          waves: *id003
      resource_limits:
        type: object
        additionalProperties: false
        required:
        - cpu_seconds
        - memory_mb
        - output_files
        properties:
          cpu_seconds:
            type: integer
            minimum: 1
          memory_mb:
            type: integer
            minimum: 1
          output_files:
            type: integer
            minimum: 1
  binding_fingerprint: *id001

schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, artifact_kind, map_id, job_id, revision,
  state, input_fingerprint, spec_fingerprint, upstream_fingerprints,
  policy_fingerprint, scenarios, acceptance_criteria, completeness,
  provider, artifact_fingerprint]
properties:
  schema_version: {type: string, const: "1.0"}
  artifact_kind: {type: string, const: SCENARIO_AC_MAP}
  map_id: {type: string, pattern: '^SCENARIOACMAP\.[A-Z0-9_.-]+$'}
  job_id: {type: string, pattern: '^JOB\.PROJECT\.[A-Z0-9_.-]+$'}
  revision: {type: integer, minimum: 0, maximum: 100}
  state: {type: string, const: STAGING}
  input_fingerprint: {$ref: '#/$defs/fingerprint'}
  spec_fingerprint: {$ref: '#/$defs/fingerprint'}
  upstream_fingerprints:
    type: object
    additionalProperties: false
    required: [input, spec]
    properties:
      input: {$ref: '#/$defs/fingerprint'}
      spec: {$ref: '#/$defs/fingerprint'}
  policy_fingerprint: {$ref: '#/$defs/fingerprint'}
  scenarios:
    type: array
    minItems: 1
    maxItems: 512
    items: {$ref: '#/$defs/scenario'}
  acceptance_criteria:
    type: array
    minItems: 1
    maxItems: 2048
    items: {$ref: '#/$defs/ac'}
  completeness:
    type: object
    additionalProperties: false
    required: [declared_complete, behavior_count, scenario_ids, ac_ids,
      omitted_behaviors]
    properties:
      declared_complete: {type: boolean, const: true}
      behavior_count: {type: integer, minimum: 1, maximum: 2048}
      scenario_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^SCENARIO\.[A-Z0-9_.-]+$'}
      ac_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^AC\.[A-Z0-9_.-]+$'}
      omitted_behaviors:
        type: array
        maxItems: 2048
        items: {type: string, minLength: 1, maxLength: 1024}
  provider: {$ref: '#/$defs/provider'}
  artifact_fingerprint: {$ref: '#/$defs/fingerprint'}
$defs:
  fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  evidence:
    type: object
    additionalProperties: false
    required: [path, line_start, line_end, snippet, snippet_fingerprint]
    properties:
      path: {type: string, minLength: 1}
      line_start: {type: integer, minimum: 1}
      line_end: {type: integer, minimum: 1}
      snippet: {type: string, minLength: 1, maxLength: 4096}
      snippet_fingerprint: {$ref: '#/$defs/fingerprint'}
  status:
    enum: [CHECKABLE, OBSERVATION_ONLY, BLOCKED_CONTRACT, SPEC_AMBIGUITY]
  scenario:
    type: object
    additionalProperties: false
    required: [scenario_id, objective, verification_level, status, reason,
      spec_evidence, item_fingerprint]
    properties:
      scenario_id: {type: string, pattern: '^SCENARIO\.[A-Z0-9_.-]+$'}
      objective: {type: string, minLength: 1, maxLength: 2048}
      verification_level: {enum: [UNIT, SUBSYSTEM, SYSTEM, OBSERVATION]}
      status: {$ref: '#/$defs/status'}
      reason: {type: string, maxLength: 1024}
      spec_evidence:
        type: array
        minItems: 1
        maxItems: 32
        items: {$ref: '#/$defs/evidence'}
      item_fingerprint: {$ref: '#/$defs/fingerprint'}
  ac:
    type: object
    additionalProperties: false
    required: [ac_id, scenario_ids, behavior, verification_level, status,
      reason, spec_evidence, item_fingerprint]
    properties:
      ac_id: {type: string, pattern: '^AC\.[A-Z0-9_.-]+$'}
      scenario_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^SCENARIO\.[A-Z0-9_.-]+$'}
      behavior: {type: string, minLength: 1, maxLength: 2048}
      verification_level: {enum: [UNIT, SUBSYSTEM, SYSTEM, OBSERVATION]}
      status: {$ref: '#/$defs/status'}
      reason: {type: string, maxLength: 1024}
      spec_evidence:
        type: array
        minItems: 1
        maxItems: 32
        items: {$ref: '#/$defs/evidence'}
      item_fingerprint: {$ref: '#/$defs/fingerprint'}
  provider:
    type: object
    additionalProperties: false
    required: [provider_id, model_id, request_id, response_id,
      input_tokens, output_tokens]
    properties:
      provider_id: {type: string, minLength: 1}
      model_id: {type: string, minLength: 1}
      request_id: {type: string, minLength: 1}
      response_id: {type: string, minLength: 1}
      input_tokens: {type: integer, minimum: 0}
      output_tokens: {type: integer, minimum: 0}

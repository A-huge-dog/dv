schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, status, repairs]
properties:
  schema_version: {type: string, const: "1.0"}
  status: {enum: [READY, INSUFFICIENT_EVIDENCE]}
  repairs:
    type: array
    maxItems: 128
    items:
      type: object
      additionalProperties: false
      required: [issue_ids, stage, targets]
      properties:
        issue_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^ISSUE\.[A-Z0-9_.-]+$'}
        stage: {enum: [STAGE_1, STAGE_2, STAGE_3]}
        targets:
          type: array
          minItems: 1
          maxItems: 256
          items: {$ref: '#/$defs/target'}
$defs:
  target:
    type: object
    additionalProperties: false
    required: [kind, id]
    properties:
      kind: {enum: [SCENARIO, ACCEPTANCE_CRITERION, TESTCASE, CODE_UNIT]}
      id: {type: string, pattern: '^[A-Z][A-Z0-9_.-]{1,255}$'}

$id: "urn:dv:project:testcase-review-candidate:6.0"
$comment: >-
  Reviewer-owned semantic findings. Runtime derives report-local issue IDs,
  exact evidence ranges/fingerprints, affected-identity closure, roots and
  report lineage. The Reviewer never chooses a repair Stage.
type: object
additionalProperties: false
required: [verdict, findings, ac_reviews, diagnostics]
properties:
  verdict: {enum: [CLEAN, FINDINGS_REPORTED]}
  findings:
    type: array
    maxItems: 128
    items: {$ref: '#/$defs/finding'}
  ac_reviews:
    type: array
    minItems: 1
    maxItems: 2048
    items: {$ref: '#/$defs/ac_review'}
  diagnostics:
    type: array
    maxItems: 128
    items: {type: string, minLength: 1, maxLength: 512}
$defs:
  spec_evidence:
    type: object
    additionalProperties: false
    required: [path, line_start, line_end]
    properties:
      path: {type: string, minLength: 1}
      line_start: {type: integer, minimum: 1}
      line_end: {type: integer, minimum: 1}
  code_evidence:
    type: object
    additionalProperties: false
    required: [content]
    properties:
      content: {type: string, minLength: 1, maxLength: 16384}
  affected:
    type: object
    additionalProperties: false
    required: [scenario_ids, ac_ids, testcase_ids, code_unit_ids]
    properties:
      scenario_ids:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^SCENARIO\.[A-Z0-9_.-]+$'}
      ac_ids:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^AC\.[A-Z0-9_.-]+$'}
      testcase_ids:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^TC\.[A-Z0-9_.-]+$'}
      code_unit_ids:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^CODE\.[A-Z0-9_.-]+$'}
  finding:
    type: object
    additionalProperties: false
    required: [severity, suspected_origin_stage, affected,
      spec_evidence, testcase_evidence, problem_and_required_change]
    properties:
      severity: {enum: [ERROR, WARNING]}
      suspected_origin_stage: {enum: [STAGE_1, STAGE_2, STAGE_3, SPEC]}
      affected: {$ref: '#/$defs/affected'}
      spec_evidence:
        type: array
        minItems: 1
        maxItems: 32
        items: {$ref: '#/$defs/spec_evidence'}
      testcase_evidence:
        type: array
        maxItems: 32
        items: {$ref: '#/$defs/code_evidence'}
      problem_and_required_change:
        {type: string, minLength: 1, maxLength: 4096}
  ac_review:
    type: object
    additionalProperties: false
    required: [ac_id, status, spec_evidence, stimulus_evidence,
      checker_evidence, omission]
    properties:
      ac_id: {type: string, pattern: '^AC\.[A-Z0-9_.-]+$'}
      status: {enum: [COVERED, OBSERVATION_ONLY, BLOCKED, OMITTED]}
      spec_evidence:
        type: array
        minItems: 1
        maxItems: 32
        items: {$ref: '#/$defs/spec_evidence'}
      stimulus_evidence:
        type: array
        maxItems: 32
        items: {$ref: '#/$defs/code_evidence'}
      checker_evidence:
        type: array
        maxItems: 32
        items: {$ref: '#/$defs/code_evidence'}
      omission: {type: string, maxLength: 2048}

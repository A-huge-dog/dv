schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, plan_id, planning_session_id, job_id,
  input_fingerprint, source_report_id, source_report_fingerprint,
  artifact_roots, scope_fingerprint, retrieval_rounds, status, orchestrator,
  repairs, plan_fingerprint]
properties:
  schema_version: {type: string, const: "1.0"}
  plan_id: {type: string, pattern: '^REPAIRPLAN\.[A-Z0-9_.-]+$'}
  planning_session_id: {type: string, pattern: '^PLANNING\.[A-Z0-9_.-]+$'}
  job_id: {type: string, pattern: '^JOB\.PROJECT\.[A-Z0-9_.-]+$'}
  input_fingerprint: {$ref: '#/$defs/fingerprint'}
  source_report_id: {type: string, pattern: '^TESTREVIEWREPORT\.[A-Z0-9_.-]+$'}
  source_report_fingerprint: {$ref: '#/$defs/fingerprint'}
  artifact_roots: {$ref: '#/$defs/roots'}
  scope_fingerprint: {$ref: '#/$defs/fingerprint'}
  retrieval_rounds: {type: integer, minimum: 0, maximum: 3}
  status: {enum: [READY, INSUFFICIENT_EVIDENCE]}
  orchestrator:
    type: object
    additionalProperties: false
    required: [runtime_role, model_class, profile_path, profile_fingerprint,
      profile_document_fingerprint, config_path, provider_id, model_id,
      config_fingerprint, config_document_fingerprint, request_id, response_id]
    properties:
      runtime_role: {type: string, const: ORCHESTRATOR}
      model_class: {type: string, minLength: 1}
      profile_path: {$ref: '#/$defs/config_path'}
      profile_fingerprint: {$ref: '#/$defs/fingerprint'}
      profile_document_fingerprint: {$ref: '#/$defs/fingerprint'}
      config_path: {$ref: '#/$defs/config_path'}
      provider_id: {type: string, minLength: 1}
      model_id: {type: string, minLength: 1}
      config_fingerprint: {$ref: '#/$defs/fingerprint'}
      config_document_fingerprint: {$ref: '#/$defs/fingerprint'}
      request_id: {type: string, minLength: 1, maxLength: 256}
      response_id: {type: string, minLength: 1, maxLength: 256}
  repairs:
    type: array
    maxItems: 128
    items:
      type: object
      additionalProperties: false
      required: [issue_ids, stage, targets]
      properties:
        issue_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^ISSUE\.[A-Z0-9_.-]+$'}
        stage: {enum: [STAGE_1, STAGE_2, STAGE_3]}
        targets:
          type: array
          minItems: 1
          maxItems: 256
          items: {$ref: '#/$defs/target'}
  plan_fingerprint: {$ref: '#/$defs/fingerprint'}
$defs:
  fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  config_path:
    {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*\.ya?ml$'}
  roots:
    type: object
    additionalProperties: false
    required: [scenario_ac_map, ac_testcase_map, testcase]
    properties:
      scenario_ac_map: {$ref: '#/$defs/fingerprint'}
      ac_testcase_map: {$ref: '#/$defs/fingerprint'}
      testcase: {$ref: '#/$defs/fingerprint'}
  target:
    type: object
    additionalProperties: false
    required: [kind, id]
    properties:
      kind: {enum: [SCENARIO, ACCEPTANCE_CRITERION, TESTCASE, CODE_UNIT]}
      id: {type: string, pattern: '^[A-Z][A-Z0-9_.-]{1,255}$'}

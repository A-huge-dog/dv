schema_version: "2.0"
type: object
additionalProperties: false
required: [schema_version, dispatch_id, group_id, job_id, input_fingerprint,
  spec_fingerprint, policy_fingerprint, owner_scope_fingerprint,
  plan_id, plan_fingerprint,
  source_report_fingerprint, regeneration_round, stage, targets, target_units,
  issue_ids, artifact_roots, unit_roots, direct_dependencies,
  authorized_spec_evidence, tool_allow_list, retrieval_call_limit,
  stage_agent, scope_fingerprint, invalidated_stages, created_at,
  dispatch_fingerprint]
properties:
  schema_version: {type: string, const: "2.0"}
  dispatch_id: {type: string, pattern: '^REPAIRDISPATCH\.[A-Z0-9_.-]+$'}
  group_id: {type: string, pattern: '^REPAIRGROUP\.[A-Z0-9_.-]+$'}
  job_id: {type: string, pattern: '^JOB\.PROJECT\.[A-Z0-9_.-]+$'}
  input_fingerprint: {$ref: '#/$defs/fingerprint'}
  spec_fingerprint: {$ref: '#/$defs/fingerprint'}
  policy_fingerprint: {$ref: '#/$defs/fingerprint'}
  owner_scope_fingerprint: {$ref: '#/$defs/fingerprint'}
  plan_id: {type: string, pattern: '^REPAIRPLAN\.[A-Z0-9_.-]+$'}
  plan_fingerprint: {$ref: '#/$defs/fingerprint'}
  source_report_fingerprint: {$ref: '#/$defs/fingerprint'}
  regeneration_round: {type: integer, const: 1}
  stage: {enum: [STAGE_1, STAGE_2, STAGE_3]}
  targets:
    type: array
    minItems: 1
    maxItems: 256
    uniqueItems: true
    items: {$ref: '#/$defs/target'}
  target_units:
    type: array
    minItems: 1
    maxItems: 256
    items: {$ref: '#/$defs/target_unit'}
  issue_ids:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: '^ISSUE\.[A-Z0-9_.-]+$'}
  artifact_roots: {$ref: '#/$defs/artifact_roots'}
  unit_roots:
    type: object
    additionalProperties: false
    required: [stage1, stage2, stage3, review]
    properties:
      stage1: {$ref: '#/$defs/fingerprint'}
      stage2: {$ref: '#/$defs/fingerprint'}
      stage3: {$ref: '#/$defs/fingerprint'}
      review: {$ref: '#/$defs/fingerprint'}
  direct_dependencies:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [target_id, dependencies]
      properties:
        target_id: {type: string, pattern: '^[A-Z][A-Z0-9_.-]{1,255}$'}
        dependencies:
          type: array
          items: {$ref: '#/$defs/dependency'}
  authorized_spec_evidence:
    type: array
    items: {$ref: '#/$defs/evidence_ref'}
  tool_allow_list:
    type: array
    minItems: 6
    maxItems: 6
    uniqueItems: true
    items:
      enum: [get_issue, get_unit, get_direct_dependencies,
        get_spec_evidence, get_repair_history, compare_unit_revisions]
  retrieval_call_limit: {type: integer, const: 3}
  stage_agent:
    type: object
    additionalProperties: false
    required: [runtime_role, model_class, profile_path, profile_fingerprint,
      profile_document_fingerprint, config_path, config_fingerprint,
      config_document_fingerprint, provider_id, model_id]
    properties:
      runtime_role: {type: string, const: STAGE_AGENT}
      model_class: {type: string, minLength: 1}
      profile_path: {$ref: '#/$defs/config_path'}
      profile_fingerprint: {$ref: '#/$defs/fingerprint'}
      profile_document_fingerprint: {$ref: '#/$defs/fingerprint'}
      config_path: {$ref: '#/$defs/config_path'}
      config_fingerprint: {$ref: '#/$defs/fingerprint'}
      config_document_fingerprint: {$ref: '#/$defs/fingerprint'}
      provider_id: {type: string, minLength: 1}
      model_id: {type: string, minLength: 1}
  scope_fingerprint: {$ref: '#/$defs/fingerprint'}
  invalidated_stages:
    type: array
    minItems: 1
    uniqueItems: true
    items: {enum: [STAGE_1, STAGE_2, STAGE_3, REVIEW]}
  created_at: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T.*Z$'}
  dispatch_fingerprint: {$ref: '#/$defs/fingerprint'}
$defs:
  fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  config_path:
    {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*\.ya?ml$'}
  target:
    type: object
    additionalProperties: false
    required: [kind, id]
    properties:
      kind: {enum: [SCENARIO, ACCEPTANCE_CRITERION, TESTCASE, CODE_UNIT]}
      id: {type: string, pattern: '^[A-Z][A-Z0-9_.-]{1,255}$'}
  target_unit:
    type: object
    additionalProperties: false
    required: [target_kind, unit_id, unit_kind, revision, repair_scope,
      content_fingerprint, dependency_fingerprint, artifact_fingerprint]
    properties:
      target_kind: {enum: [SCENARIO, ACCEPTANCE_CRITERION, TESTCASE, CODE_UNIT]}
      unit_id: {type: string, pattern: '^[A-Z][A-Z0-9_.-]{1,255}$'}
      unit_kind:
        enum: [SCENARIO, ACCEPTANCE_CRITERION, LOGICAL_TESTCASE,
          CODE_SHARED, CODE_TESTCASE]
      revision: {type: integer, minimum: 0, maximum: 999}
      repair_scope: {enum: [LOCAL, SHARED]}
      content_fingerprint: {$ref: '#/$defs/fingerprint'}
      dependency_fingerprint: {$ref: '#/$defs/fingerprint'}
      artifact_fingerprint: {$ref: '#/$defs/fingerprint'}
  dependency:
    type: object
    additionalProperties: false
    required: [kind, identity, fingerprint, revision, artifact_fingerprint]
    properties:
      kind: {type: string, minLength: 1}
      identity: {type: string, minLength: 1}
      fingerprint: {$ref: '#/$defs/fingerprint'}
      revision:
        anyOf:
          - {type: integer, minimum: 0, maximum: 999}
          - {type: 'null'}
      artifact_fingerprint:
        anyOf:
          - {$ref: '#/$defs/fingerprint'}
          - {type: 'null'}
  evidence_ref:
    type: object
    additionalProperties: false
    required: [path, line_start, line_end, snippet_fingerprint]
    properties:
      path: {type: string, minLength: 1}
      line_start: {type: integer, minimum: 1}
      line_end: {type: integer, minimum: 1}
      snippet_fingerprint: {$ref: '#/$defs/fingerprint'}
  artifact_roots:
    type: object
    additionalProperties: false
    required: [scenario_ac_map, ac_testcase_map, testcase, effective_uvm]
    properties:
      scenario_ac_map: {$ref: '#/$defs/fingerprint'}
      ac_testcase_map: {$ref: '#/$defs/fingerprint'}
      testcase: {$ref: '#/$defs/fingerprint'}
      effective_uvm: {$ref: '#/$defs/fingerprint'}

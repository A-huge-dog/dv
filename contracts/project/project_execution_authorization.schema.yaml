schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, artifact_kind, authorization_id, job_id,
  purpose, authorizer_identity, authorizer_role, testcase_approval_fingerprint,
  profile_id, executable_ref, environment_identity, environment_fingerprint,
  constraints, authorized_at, expires_at, authorization_fingerprint]
properties:
  schema_version: {type: string, const: "1.0"}
  artifact_kind: {type: string, const: PROJECT_EXECUTION_AUTHORIZATION}
  authorization_id:
    {type: string, pattern: '^AUTHORIZATION\.PROJECT\.[A-Z0-9_.-]+$'}
  job_id: {type: string, pattern: '^JOB\.PROJECT\.[A-Z0-9_.-]+$'}
  purpose: {type: string, const: EXECUTE_APPROVED_TESTCASE}
  authorizer_identity: {type: string, minLength: 1, maxLength: 256}
  authorizer_role: {type: string, const: DV_OWNER}
  testcase_approval_fingerprint: {$ref: '#/$defs/fingerprint'}
  profile_id: {type: string, const: EDAPROFILE.XCELIUM.PROJECT.V1}
  executable_ref: {type: string, const: EDAEXEC.XCELIUM}
  environment_identity:
    {type: string, pattern: '^XCELIUMENV\.[A-Z0-9_.-]+$'}
  environment_fingerprint: {$ref: '#/$defs/fingerprint'}
  constraints:
    type: object
    additionalProperties: false
    required: [timeout_seconds, seed, uvm, coverage, waves]
    properties:
      timeout_seconds: {type: integer, minimum: 1, maximum: 3600}
      seed: {type: integer, minimum: 1, maximum: 2147483647}
      uvm: {type: boolean}
      coverage: {type: boolean}
      waves: {type: boolean}
  authorized_at: {$ref: '#/$defs/timestamp'}
  expires_at: {$ref: '#/$defs/timestamp'}
  authorization_fingerprint: {$ref: '#/$defs/fingerprint'}
$defs:
  fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  timestamp:
    {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T.*Z$'}


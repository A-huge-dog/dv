schema_version: "7.0"
type: object
additionalProperties: false
required: [schema_version, workflow_version, review_id, review_request_id,
  review_round, review_phase, previous_report_fingerprint, previous_report,
  repair_lineage, job_id, thread_id,
  created_at, input_fingerprint, spec_fingerprint, artifact_roots, generator,
  reviewer, deterministic_validation, policy_fingerprint,
  upstream_fingerprints, owner_routing_decision, scenario_spec_issues,
  coverage_scope, routing_fingerprint, spec_evidence, scenario_ac_map,
  ac_testcase_map, testcase_candidate, runtime_capability, request_fingerprint]
properties:
  schema_version: {type: string, const: "7.0"}
  workflow_version: {type: string, const: "6.0"}
  review_id: {type: string, pattern: '^REVIEW\.PROJECT\.[A-Z0-9_.-]+$'}
  review_request_id: {type: string, pattern: '^REQUEST\.PROJECT\.REVIEW\.[A-Z0-9_.-]+$'}
  review_round: {type: integer, minimum: 1, maximum: 2}
  review_phase: {enum: [INITIAL, FINAL]}
  previous_report_fingerprint:
    anyOf:
      - {type: string, const: NONE}
      - {$ref: '#/$defs/fingerprint'}
  previous_report:
    anyOf:
      - {type: 'null'}
      - {type: object}
  repair_lineage:
    type: array
    maxItems: 256
    items:
      type: object
      additionalProperties: false
      required: [record_type, path, record_fingerprint, record]
      properties:
        record_type: {type: string, minLength: 1}
        path: {type: string, minLength: 1}
        record_fingerprint: {$ref: '#/$defs/fingerprint'}
        record: {type: object}
  job_id: {type: string, pattern: '^JOB\.PROJECT\.[A-Z0-9_.-]+$'}
  thread_id: {type: string, minLength: 1}
  created_at: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T.*Z$'}
  input_fingerprint: {$ref: '#/$defs/fingerprint'}
  spec_fingerprint: {$ref: '#/$defs/fingerprint'}
  artifact_roots: {$ref: '#/$defs/roots'}
  generator:
    type: object
    additionalProperties: false
    required: [runtime_role, profile_path, profile_fingerprint,
      profile_document_fingerprint, config_path, config_fingerprint,
      config_document_fingerprint, provider_id, model_id, request_id,
      response_id]
    properties:
      runtime_role: {type: string, const: GENERATOR}
      profile_path: {$ref: '#/$defs/config_path'}
      profile_fingerprint: {$ref: '#/$defs/fingerprint'}
      profile_document_fingerprint: {$ref: '#/$defs/fingerprint'}
      config_path: {$ref: '#/$defs/config_path'}
      config_fingerprint: {$ref: '#/$defs/fingerprint'}
      config_document_fingerprint: {$ref: '#/$defs/fingerprint'}
      provider_id: {type: string, minLength: 1}
      model_id: {type: string, minLength: 1}
      request_id: {type: string, minLength: 1}
      response_id: {type: string, minLength: 1}
  reviewer:
    type: object
    additionalProperties: false
    required: [runtime_role, model_class, profile_path, profile_fingerprint,
      profile_document_fingerprint, config_path, config_fingerprint,
      config_document_fingerprint, provider_id, model_id, request_id]
    properties:
      runtime_role: {type: string, const: REVIEWER}
      model_class: {type: string, minLength: 1}
      profile_path: {$ref: '#/$defs/config_path'}
      profile_fingerprint: {$ref: '#/$defs/fingerprint'}
      profile_document_fingerprint: {$ref: '#/$defs/fingerprint'}
      config_path: {$ref: '#/$defs/config_path'}
      config_fingerprint: {$ref: '#/$defs/fingerprint'}
      config_document_fingerprint: {$ref: '#/$defs/fingerprint'}
      provider_id: {type: string, minLength: 1}
      model_id: {type: string, minLength: 1}
      request_id: {type: string, minLength: 1}
  deterministic_validation:
    type: object
    additionalProperties: false
    required: [status, validation_fingerprint]
    properties:
      status: {type: string, const: PASS}
      validation_fingerprint: {$ref: '#/$defs/fingerprint'}
  policy_fingerprint: {$ref: '#/$defs/fingerprint'}
  upstream_fingerprints:
    type: object
    additionalProperties: false
    required: [input, spec, scenario_ac_map, ac_testcase_map, testcase, effective_uvm,
      owner_routing, scenario_spec_issues]
    properties:
      input: {$ref: '#/$defs/fingerprint'}
      spec: {$ref: '#/$defs/fingerprint'}
      scenario_ac_map: {$ref: '#/$defs/fingerprint'}
      ac_testcase_map: {$ref: '#/$defs/fingerprint'}
      testcase: {$ref: '#/$defs/fingerprint'}
      effective_uvm: {$ref: '#/$defs/fingerprint'}
      owner_routing: {$ref: '#/$defs/fingerprint'}
      scenario_spec_issues: {$ref: '#/$defs/fingerprint'}
  owner_routing_decision:
    type: object
    additionalProperties: false
    required: [path, submission]
    properties:
      path: {type: string, const: audit/scenario_owner_review_submission.json}
      submission: {type: object}
  scenario_spec_issues: {type: object}
  coverage_scope:
    type: object
    additionalProperties: false
    required: [scope_kind, executable_scenario_ids, executable_ac_ids,
      spec_issue_scenario_ids, spec_issue_ac_ids,
      executable_subset_complete, full_spec_coverage_complete,
      scope_fingerprint]
    properties:
      scope_kind: {type: string, const: OWNER_ROUTED_EXECUTABLE_SUBSET}
      executable_scenario_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^SCENARIO\.[A-Z0-9_.-]+$'}
      executable_ac_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^AC\.[A-Z0-9_.-]+$'}
      spec_issue_scenario_ids:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^SCENARIO\.[A-Z0-9_.-]+$'}
      spec_issue_ac_ids:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^AC\.[A-Z0-9_.-]+$'}
      executable_subset_complete: {type: boolean, const: true}
      full_spec_coverage_complete: {type: boolean}
      scope_fingerprint: {$ref: '#/$defs/fingerprint'}
  routing_fingerprint: {$ref: '#/$defs/fingerprint'}
  spec_evidence:
    type: array
    minItems: 1
    maxItems: 64
    items:
      type: object
      additionalProperties: false
      required: [path, fingerprint, content]
      properties:
        path: {type: string, minLength: 1}
        fingerprint: {$ref: '#/$defs/fingerprint'}
        content: {type: string, maxLength: 8388608}
  scenario_ac_map: {type: object}
  ac_testcase_map: {type: object}
  testcase_candidate: {type: object}
  runtime_capability:
    type: object
    additionalProperties: false
    required: [capability_id, aggregate_fingerprint, uvm_context_files]
    properties:
      capability_id: {type: string, pattern: '^[A-Z][A-Z0-9_.-]{0,127}$'}
      aggregate_fingerprint: {$ref: '#/$defs/fingerprint'}
      uvm_context_files:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [logical_path, fingerprint, content, kind]
          properties:
            logical_path: {type: string, minLength: 1}
            fingerprint: {$ref: '#/$defs/fingerprint'}
            content: {type: string}
            kind: {enum: [CAPABILITY_CONTRACT, PUBLIC_DECLARATION]}
  request_fingerprint: {$ref: '#/$defs/fingerprint'}
$defs:
  fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  config_path:
    {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*\.ya?ml$'}
  roots:
    type: object
    additionalProperties: false
    required: [scenario_ac_map, ac_testcase_map, testcase, effective_uvm]
    properties:
      scenario_ac_map: {$ref: '#/$defs/fingerprint'}
      ac_testcase_map: {$ref: '#/$defs/fingerprint'}
      testcase: {$ref: '#/$defs/fingerprint'}
      effective_uvm: {$ref: '#/$defs/fingerprint'}

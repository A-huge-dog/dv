schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, artifact_kind, job_id, input_fingerprint, cycle_id,
  cycle_kind, repair_revision, stage2_root, attempt, baseline_uvm_root,
  replacement_contents, replacement_files, effective_files,
  effective_uvm_root, provider_request_path, provider_request_fingerprint,
  provider_response_path, provider_response_fingerprint, transcript_path,
  candidate_path, candidate_fingerprint]
properties:
  schema_version: {const: "1.0"}
  artifact_kind: {const: UVM_GENERATION_CANDIDATE}
  job_id: {type: string, pattern: '^JOB\.PROJECT\.[A-Z0-9_.-]+$'}
  input_fingerprint: {$ref: '#/$defs/fingerprint'}
  cycle_id: {$ref: '#/$defs/cycle'}
  cycle_kind: {enum: [INITIAL, REPAIR]}
  repair_revision: {type: [integer, 'null'], minimum: 1}
  stage2_root: {$ref: '#/$defs/fingerprint'}
  attempt: {type: integer, minimum: 1}
  baseline_uvm_root: {$ref: '#/$defs/fingerprint'}
  replacement_contents:
    type: array
    minItems: 1
    maxItems: 128
    items: {$ref: '#/$defs/replacement'}
  replacement_files:
    type: array
    minItems: 1
    maxItems: 128
    items: {$ref: '#/$defs/file'}
  effective_files:
    type: array
    minItems: 1
    maxItems: 128
    items: {$ref: '#/$defs/file'}
  effective_uvm_root: {$ref: '#/$defs/fingerprint'}
  provider_request_path: {$ref: '#/$defs/job_path'}
  provider_request_fingerprint: {$ref: '#/$defs/fingerprint'}
  provider_response_path: {$ref: '#/$defs/job_path'}
  provider_response_fingerprint: {$ref: '#/$defs/fingerprint'}
  transcript_path: {$ref: '#/$defs/job_path'}
  candidate_path: {$ref: '#/$defs/job_path'}
  candidate_fingerprint: {$ref: '#/$defs/fingerprint'}
$defs:
  fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  cycle: {type: string, pattern: '^(initial|repair-r[0-9]{3})$'}
  logical: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*\.(sv|svh|v)$'}
  job_path: {type: string, pattern: '^(staging|audit|transcripts)/[A-Za-z0-9._/-]+$'}
  replacement:
    type: object
    additionalProperties: false
    required: [logical_path, content]
    properties:
      logical_path: {$ref: '#/$defs/logical'}
      content: {type: string}
  file:
    type: object
    additionalProperties: false
    required: [logical_path, path, fingerprint, size_bytes, source]
    properties:
      logical_path: {$ref: '#/$defs/logical'}
      path: {$ref: '#/$defs/job_path'}
      fingerprint: {$ref: '#/$defs/fingerprint'}
      size_bytes: {type: integer, minimum: 0}
      source: {enum: [BASELINE, REPLACEMENT]}

schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, workflow_version, artifact_kind, state,
  commit_id, job_id, input_fingerprint, spec_fingerprint,
  policy_fingerprint, owner_scope_fingerprint, source_checkpoint_path,
  source_checkpoint_fingerprint, replacement_path, replacement_fingerprint,
  dispatch_fingerprint, compile_validation_path,
  compile_validation_fingerprint, impact_manifest_path,
  impact_fingerprint, stage, target_units, old_artifact_paths,
  new_artifact_paths, old_artifact_roots, new_artifact_roots,
  old_index_paths, new_index_paths, old_unit_roots, new_unit_roots,
  prior_review_index_path, prior_review_root, commit_fingerprint]
properties:
  schema_version: {type: string, const: "1.0"}
  workflow_version: {type: string, const: "6.0"}
  artifact_kind: {type: string, const: PROJECT_SERIAL_GROUP_COMMIT}
  state: {type: string, const: COMMITTED_AWAITING_FINAL_REVIEW}
  commit_id: {type: string, pattern: '^COMMIT\.PROJECT\.[A-Z0-9_.-]+$'}
  job_id: {type: string, pattern: '^JOB\.PROJECT\.[A-Z0-9_.-]+$'}
  input_fingerprint: {$ref: '#/$defs/fingerprint'}
  spec_fingerprint: {$ref: '#/$defs/fingerprint'}
  policy_fingerprint: {$ref: '#/$defs/fingerprint'}
  owner_scope_fingerprint: {$ref: '#/$defs/fingerprint'}
  source_checkpoint_path:
    {type: string, pattern: '^audit/(oches002_scoped_replacement_validated|oches003_groups/[a-z0-9]+\.validated)\.json$'}
  source_checkpoint_fingerprint: {$ref: '#/$defs/fingerprint'}
  replacement_path: {type: string, pattern: '^staging/scoped_replacements/[0-9a-f]{24}\.json$'}
  replacement_fingerprint: {$ref: '#/$defs/fingerprint'}
  dispatch_fingerprint: {$ref: '#/$defs/fingerprint'}
  compile_validation_path: {type: string, pattern: '^staging/validations/oches003_compile\.[0-9a-f]{24}\.json$'}
  compile_validation_fingerprint: {$ref: '#/$defs/fingerprint'}
  impact_manifest_path: {type: string, pattern: '^staging/units/impact/impact\.r[0-9]{3}\.json$'}
  impact_fingerprint: {$ref: '#/$defs/fingerprint'}
  stage: {enum: [STAGE_1, STAGE_2, STAGE_3]}
  target_units:
    type: array
    minItems: 1
    maxItems: 256
    items:
      type: object
      additionalProperties: false
      required: [unit_id, unit_kind, old_revision, new_revision,
        old_artifact_fingerprint, new_artifact_fingerprint]
      properties:
        unit_id: {type: string, minLength: 1, maxLength: 256}
        unit_kind: {type: string, minLength: 1, maxLength: 64}
        old_revision: {type: integer, minimum: 0, maximum: 999}
        new_revision: {type: integer, minimum: 1, maximum: 999}
        old_artifact_fingerprint: {$ref: '#/$defs/fingerprint'}
        new_artifact_fingerprint: {$ref: '#/$defs/fingerprint'}
  old_artifact_paths: {$ref: '#/$defs/paths'}
  new_artifact_paths: {$ref: '#/$defs/paths'}
  old_artifact_roots: {$ref: '#/$defs/artifact_roots'}
  new_artifact_roots: {$ref: '#/$defs/artifact_roots'}
  old_index_paths: {$ref: '#/$defs/index_paths'}
  new_index_paths: {$ref: '#/$defs/index_paths'}
  old_unit_roots: {$ref: '#/$defs/unit_roots'}
  new_unit_roots: {$ref: '#/$defs/unit_roots'}
  prior_review_index_path: {type: string, pattern: '^staging/units/review/index\.current\.r[0-9]{3}\.json$'}
  prior_review_root: {$ref: '#/$defs/fingerprint'}
  commit_fingerprint: {$ref: '#/$defs/fingerprint'}
$defs:
  fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  paths:
    type: object
    additionalProperties: false
    required: [scenario_ac_map, ac_testcase_map, testcase]
    properties:
      scenario_ac_map: {type: string, minLength: 1}
      ac_testcase_map: {type: string, minLength: 1}
      testcase: {type: string, minLength: 1}
  index_paths:
    type: object
    additionalProperties: false
    required: [stage1, stage2, stage3]
    properties:
      stage1: {type: string, pattern: '^staging/units/stage1/index\.current\.r[0-9]{3}\.json$'}
      stage2: {type: string, pattern: '^staging/units/stage2/index\.current\.r[0-9]{3}\.json$'}
      stage3: {type: string, pattern: '^staging/units/stage3/index\.current\.r[0-9]{3}\.json$'}
  artifact_roots:
    type: object
    additionalProperties: false
    required: [scenario_ac_map, ac_testcase_map, testcase]
    properties:
      scenario_ac_map: {$ref: '#/$defs/fingerprint'}
      ac_testcase_map: {$ref: '#/$defs/fingerprint'}
      testcase: {$ref: '#/$defs/fingerprint'}
  unit_roots:
    type: object
    additionalProperties: false
    required: [stage1, stage2, stage3]
    properties:
      stage1: {$ref: '#/$defs/fingerprint'}
      stage2: {$ref: '#/$defs/fingerprint'}
      stage3: {$ref: '#/$defs/fingerprint'}

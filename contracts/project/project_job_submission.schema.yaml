schema_version: "2.0"
type: object
additionalProperties: false
required: [schema_version, job_id, project_id, spec, rtl, uvm_testcase_context, agent_profile, eda,
  input_authority]
properties:
  schema_version: {type: string, const: "2.0"}
  job_id: {type: string, pattern: '^JOB\.PROJECT\.[A-Z0-9_.-]+$'}
  project_id: {type: string, pattern: '^PROJECT\.[A-Z0-9_.-]+$'}
  spec:
    type: object
    additionalProperties: false
    required: [sources]
    properties:
      sources:
        type: array
        minItems: 1
        maxItems: 64
        uniqueItems: true
        items: {$ref: '#/$defs/source_path'}
  rtl:
    type: object
    additionalProperties: false
    required: [sources, top, parameters]
    properties:
      sources:
        type: array
        minItems: 1
        maxItems: 64
        uniqueItems: true
        items: {$ref: '#/$defs/source_path'}
      top: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_$]*$'}
      parameters: {type: object}
  uvm_testcase_context:
    type: object
    additionalProperties: false
    required: [files, generated_files]
    properties:
      files:
        type: array
        minItems: 1
        maxItems: 128
        uniqueItems: true
        items: {$ref: '#/$defs/uvm_context_path'}
      generated_files:
        type: array
        minItems: 1
        maxItems: 128
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/\-]*\.(sv|svh|v)$'
  agent_profile: {$ref: '#/$defs/config_path'}
  eda:
    type: object
    additionalProperties: false
    required: [profile_id, timeout_seconds]
    properties:
      profile_id:
        {type: string, const: EDAPROFILE.XCELIUM.PROJECT.V1}
      timeout_seconds: {type: integer, minimum: 1, maximum: 600}
  input_authority:
    type: object
    additionalProperties: false
    required: [actor_type, identity, roles, decision]
    properties:
      actor_type: {type: string, const: HUMAN}
      identity: {type: string, minLength: 1, maxLength: 256}
      roles:
        type: array
        minItems: 2
        maxItems: 2
        uniqueItems: true
        items: {enum: [SPEC_OWNER, DESIGN_OWNER]}
      decision: {type: string, const: APPROVE}
$defs:
  source_path:
    type: string
    minLength: 1
    maxLength: 512
    pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*\.(sv|svh|v|md|txt)$'
  uvm_context_path:
    type: string
    minLength: 1
    maxLength: 4096
    pattern: '^(/|[A-Za-z0-9])[A-Za-z0-9._/\\-]*\.(sv|svh|v)$'
  config_path:
    type: string
    minLength: 1
    maxLength: 512
    pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*\.ya?ml$'

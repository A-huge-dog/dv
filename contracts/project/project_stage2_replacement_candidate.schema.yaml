type: object
additionalProperties: false
required: [replacements]
properties:
  replacements:
    type: array
    minItems: 1
    maxItems: 256
    items: {$ref: '#/$defs/replacement'}
$defs:
  replacement:
    type: object
    additionalProperties: false
    required: [unit_id, semantic_body]
    properties:
      unit_id: {type: string, pattern: '^TC\.[A-Z0-9_.-]+$'}
      semantic_body: {$ref: '#/$defs/testcase_body'}
  testcase_body:
    type: object
    additionalProperties: false
    required: [objective, preconditions, stimulus, transaction_sequence,
      timing_intent, checker, expected_result, failure_condition,
      timeout_cycles, status, reason, scenario_ids, ac_ids]
    properties:
      objective: {type: string, minLength: 1}
      preconditions: {type: string, minLength: 1}
      stimulus: {type: string}
      transaction_sequence: {type: string}
      timing_intent: {type: string, minLength: 1}
      checker: {type: string}
      expected_result: {type: string}
      failure_condition: {type: string}
      timeout_cycles: {type: integer, minimum: 1}
      status:
        {enum: [PLANNED, CHECKABLE, OBSERVATION_ONLY, BLOCKED_CONTRACT, SPEC_AMBIGUITY]}
      reason: {type: string}
      scenario_ids:
        type: array
        items: {type: string, pattern: '^SCENARIO\.[A-Z0-9_.-]+$'}
      ac_ids:
        type: array
        items: {type: string, pattern: '^AC\.[A-Z0-9_.-]+$'}

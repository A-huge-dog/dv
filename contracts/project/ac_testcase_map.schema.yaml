schema_version: "1.0"
type: object
additionalProperties: false
required: [schema_version, artifact_kind, map_id, job_id, revision, state,
  input_fingerprint, spec_fingerprint, scenario_ac_map_fingerprint,
  upstream_fingerprints, policy_fingerprint, storage, logical_testcases,
  shards, ac_coverage, completeness, provider, artifact_fingerprint]
properties:
  schema_version: {type: string, const: "1.0"}
  artifact_kind: {type: string, const: AC_TESTCASE_MAP}
  map_id: {type: string, pattern: '^ACTESTCASEMAP\.[A-Z0-9_.-]+$'}
  job_id: {type: string, pattern: '^JOB\.PROJECT\.[A-Z0-9_.-]+$'}
  revision: {type: integer, minimum: 0, maximum: 100}
  state: {type: string, const: STAGING}
  input_fingerprint: {$ref: '#/$defs/fingerprint'}
  spec_fingerprint: {$ref: '#/$defs/fingerprint'}
  scenario_ac_map_fingerprint: {$ref: '#/$defs/fingerprint'}
  upstream_fingerprints:
    type: object
    additionalProperties: false
    required: [input, spec, scenario_ac_map]
    properties:
      input: {$ref: '#/$defs/fingerprint'}
      spec: {$ref: '#/$defs/fingerprint'}
      scenario_ac_map: {$ref: '#/$defs/fingerprint'}
  policy_fingerprint: {$ref: '#/$defs/fingerprint'}
  storage: {enum: [INLINE, SHARDED]}
  logical_testcases:
    type: array
    maxItems: 2048
    items: {$ref: '#/$defs/testcase'}
  shards:
    type: array
    maxItems: 256
    items:
      type: object
      additionalProperties: false
      required: [shard_id, path, testcase_ids, content_fingerprint]
      properties:
        shard_id: {type: string, pattern: '^ACTESTCASESHARD\.[A-Z0-9_.-]+$'}
        path: {type: string, pattern: '^staging/mappings/shards/ac_testcases\.r[0-9]{3}\.s[0-9]{3}\.json$'}
        testcase_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^TC\.[A-Z0-9_.-]+$'}
        content_fingerprint: {$ref: '#/$defs/fingerprint'}
  ac_coverage:
    type: array
    minItems: 1
    maxItems: 2048
    items:
      type: object
      additionalProperties: false
      required: [ac_id, testcase_ids, coverage_fingerprint]
      properties:
        ac_id: {type: string, pattern: '^AC\.[A-Z0-9_.-]+$'}
        testcase_ids:
          type: array
          uniqueItems: true
          items: {type: string, pattern: '^TC\.[A-Z0-9_.-]+$'}
        coverage_fingerprint: {$ref: '#/$defs/fingerprint'}
  completeness:
    type: object
    additionalProperties: false
    required: [declared_complete, ac_ids, testcase_ids, omitted_ac_ids]
    properties:
      declared_complete: {type: boolean, const: true}
      ac_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^AC\.[A-Z0-9_.-]+$'}
      testcase_ids:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^TC\.[A-Z0-9_.-]+$'}
      omitted_ac_ids:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^AC\.[A-Z0-9_.-]+$'}
  provider: {$ref: '#/$defs/provider'}
  artifact_fingerprint: {$ref: '#/$defs/fingerprint'}
$defs:
  fingerprint: {type: string, pattern: '^[0-9a-f]{64}$'}
  evidence:
    type: object
    additionalProperties: false
    required: [path, line_start, line_end, snippet, snippet_fingerprint]
    properties:
      path: {type: string, minLength: 1}
      line_start: {type: integer, minimum: 1}
      line_end: {type: integer, minimum: 1}
      snippet: {type: string, minLength: 1, maxLength: 4096}
      snippet_fingerprint: {$ref: '#/$defs/fingerprint'}
  testcase:
    type: object
    additionalProperties: false
    required: [testcase_id, objective, scenario_ids, ac_ids, preconditions,
      stimulus, transaction_sequence, timing_intent, checker, expected_result,
      failure_condition, timeout_cycles, status, spec_evidence,
      testcase_fingerprint]
    properties:
      testcase_id: {type: string, pattern: '^TC\.[A-Z0-9_.-]+$'}
      objective: {type: string, minLength: 1, maxLength: 2048}
      scenario_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^SCENARIO\.[A-Z0-9_.-]+$'}
      ac_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^AC\.[A-Z0-9_.-]+$'}
      preconditions: {type: string, minLength: 1, maxLength: 2048}
      stimulus: {type: string, maxLength: 4096}
      transaction_sequence: {type: string, maxLength: 4096}
      timing_intent: {type: string, minLength: 1, maxLength: 2048}
      checker: {type: string, maxLength: 4096}
      expected_result: {type: string, maxLength: 4096}
      failure_condition: {type: string, maxLength: 4096}
      timeout_cycles: {type: integer, minimum: 1, maximum: 1000000}
      status:
        enum: [PLANNED, CHECKABLE, OBSERVATION_ONLY, BLOCKED_CONTRACT,
          SPEC_AMBIGUITY]
      spec_evidence:
        type: array
        minItems: 1
        maxItems: 32
        items: {$ref: '#/$defs/evidence'}
      testcase_fingerprint: {$ref: '#/$defs/fingerprint'}
  provider:
    type: object
    additionalProperties: false
    required: [provider_id, model_id, request_id, response_id,
      input_tokens, output_tokens]
    properties:
      provider_id: {type: string, minLength: 1}
      model_id: {type: string, minLength: 1}
      request_id: {type: string, minLength: 1}
      response_id: {type: string, minLength: 1}
      input_tokens: {type: integer, minimum: 0}
      output_tokens: {type: integer, minimum: 0}

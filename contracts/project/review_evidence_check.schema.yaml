$id: "urn:dv:project:review-evidence-check:1.0"
type: object
additionalProperties: false
required:
  [review_request_id, review_request_fingerprint, candidate_fingerprint, checks]
properties:
  review_request_id:
    type: string
    pattern: '^REQUEST\.PROJECT\.REVIEW\.[A-Z0-9]+$'
  review_request_fingerprint:
    type: string
    pattern: '^[0-9a-f]{64}$'
  candidate_fingerprint:
    type: string
    pattern: '^[0-9a-f]{64}$'
  checks:
    type: array
    minItems: 1
    maxItems: 64
    items:
      type: object
      additionalProperties: false
      required: [check_id, ac_id, evidence_kind, content]
      properties:
        check_id:
          type: string
          pattern: '^CHECK\.[A-Z0-9_.-]+$'
        ac_id:
          type: string
          pattern: '^AC\.[A-Z0-9_.-]+$'
        evidence_kind:
          enum: [CANDIDATE, STIMULUS, CHECKER]
        content:
          type: string
          minLength: 1
          maxLength: 16384

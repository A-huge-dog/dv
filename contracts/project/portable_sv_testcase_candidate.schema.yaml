$id: "urn:dv:project:portable-sv-testcase-candidate:9.0"
$comment: >-
  Model-owned Stage 3 generic code units and deterministic assembly order.
  A complete candidate may use one TESTCASE unit or split code across
  SHARED/TESTCASE units. Runtime owns formal identities, fingerprints,
  validation and lineage. AC-level code evidence belongs exclusively to the
  Reviewer contract.
type: object
additionalProperties: false
required: [code_units, assembly, implemented_testcase_ids]
properties:
  code_units:
    type: array
    minItems: 1
    maxItems: 4096
    items:
      type: object
      additionalProperties: false
      required: [role, testcase_ids, content]
      properties:
        role: {enum: [SHARED, TESTCASE]}
        testcase_ids:
          type: array
          uniqueItems: true
          items: {type: string, pattern: '^TC\.[A-Z0-9_.-]+$'}
        content: {type: string, minLength: 1, maxLength: 262144}
  assembly:
    type: array
    minItems: 1
    maxItems: 4096
    uniqueItems: true
    items: {type: integer, minimum: 0, maximum: 4095}
  implemented_testcase_ids:
    type: array
    uniqueItems: true
    items: {type: string, pattern: '^TC\.[A-Z0-9_.-]+$'}
